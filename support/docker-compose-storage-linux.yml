services:
  postgres-db:
    container_name: postgres-db.dev
    hostname: postgres-db.dev
    extends:
      file: support/docker-base-services/base-compose-services-storage.yml
      service: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      # - ./storage/postgres/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
      - "$PROJECT_DIRECTORY/support/storage/postgres/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d"

  cassandra-db:
    container_name: cassandra-db
#    command: ["-Dcassandra.auto_snapshot=false"]
    extends:
        file: support/docker-base-services/base-compose-services-storage.yml
        service: cassandra
    volumes:
      - cassandra_data:/var/lib/cassandra
      - ./dump:/dump
      - ./db/cassandra:/configs
    networks:
        - cassandra_network

  cassandra-temp:
    container_name: cassandra-temp
    # hostname: cassandra_temp
    extends:
        file: support/docker-base-services/base-compose-services-storage.yml
        service: cassandra-util
    volumes:
      # - ./storage/cassandra/scripts/bash:/docker-entrypoint.sh
      - "$PROJECT_DIRECTORY/support/storage/cassandra/scripts/bash:/docker-entrypoint.sh"
      # - ./storage/cassandra/scripts/cql:/tmp/cql
      - "$PROJECT_DIRECTORY/support/storage/cassandra/scripts/cql:/tmp/cql"
    networks:
      - cassandra_network
    command: >
      bash ./docker-entrypoint.sh/execute-cql.sh

networks:
  cassandra_network:

volumes:
  pgdata:
  cassandra_data:
